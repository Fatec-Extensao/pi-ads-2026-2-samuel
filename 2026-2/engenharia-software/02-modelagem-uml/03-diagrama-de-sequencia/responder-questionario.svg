<svg xmlns="http://www.w3.org/2000/svg" width="1790" height="1780" viewBox="0 0 1790 1780">
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#42536A"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#1F2937} .line{stroke:#9AA8B8;stroke-width:2;stroke-dasharray:7 6} .msg{stroke:#42536A;stroke-width:2.2;marker-end:url(#arr)} .label{font-size:18px} .small{font-size:17px} .note{font-size:16px;fill:#354458}</style>
<text x="895" y="45" text-anchor="middle" font-size="27" font-weight="bold">UC05–UC07 — Responder e concluir questionário</text>
<rect x="13" y="77" width="324" height="59" rx="8" fill="#EAF1FA" stroke="#607792" stroke-width="2"/>
<text x="175" y="112" font-size="20" text-anchor="middle">Respondente</text>
<line class="line" x1="175" y1="136" x2="175" y2="1430"/>
<rect x="453" y="77" width="324" height="59" rx="8" fill="#EAF1FA" stroke="#607792" stroke-width="2"/>
<text x="615" y="112" font-size="20" text-anchor="middle">Interface web (prevista)</text>
<line class="line" x1="615" y1="136" x2="615" y2="1430"/>
<rect x="903" y="77" width="324" height="59" rx="8" fill="#EAF1FA" stroke="#607792" stroke-width="2"/>
<text x="1065" y="112" font-size="20" text-anchor="middle">Serviço (previsto)</text>
<line class="line" x1="1065" y1="136" x2="1065" y2="1430"/>
<rect x="1388" y="77" width="324" height="59" rx="8" fill="#EAF1FA" stroke="#607792" stroke-width="2"/>
<text x="1550" y="112" font-size="20" text-anchor="middle">PostgreSQL</text>
<line class="line" x1="1550" y1="136" x2="1550" y2="1430"/>
<rect x="390" y="148" width="895" height="53" rx="6" fill="#FFF6DB" stroke="#C7AC6A"/>
<text x="838" y="179" text-anchor="middle" class="note">Os componentes de interface e backend são previstos, não implementados.</text>
<line class="msg" x1="175" y1="247" x2="607" y2="247" />
<text x="395.0" y="235" text-anchor="middle" class="label">1 · Informar credenciais e token</text>
<line class="msg" x1="615" y1="319" x2="1057" y2="319" />
<text x="840.0" y="307" text-anchor="middle" class="label">2 · Solicitar acesso</text>
<line class="msg" x1="1065" y1="392" x2="1542" y2="392" />
<text x="1307.5" y="380" text-anchor="middle" class="label">3 · Validar hash e participação</text>
<line class="msg" x1="1550" y1="463" x2="1073" y2="463" stroke-dasharray="8 5"/>
<text x="1307.5" y="451" text-anchor="middle" class="label">4 · Contexto autorizado</text>
<line class="msg" x1="1065" y1="534" x2="1542" y2="534" />
<text x="1307.5" y="522" text-anchor="middle" class="label">5 · Carregar questões da categoria</text>
<line class="msg" x1="1550" y1="605" x2="1073" y2="605" stroke-dasharray="8 5"/>
<text x="1307.5" y="593" text-anchor="middle" class="label">6 · Questões e alternativas</text>
<line class="msg" x1="1065" y1="677" x2="623" y2="677" stroke-dasharray="8 5"/>
<text x="840.0" y="665" text-anchor="middle" class="label">7 · Apresentar questionário</text>
<line class="msg" x1="175" y1="748" x2="607" y2="748" />
<text x="395.0" y="736" text-anchor="middle" class="label">8 · Preencher e confirmar envio</text>
<line class="msg" x1="615" y1="821" x2="1057" y2="821" />
<text x="840.0" y="809" text-anchor="middle" class="label">9 · Submeter token e itens</text>
<line class="msg" x1="1065" y1="892" x2="1542" y2="892" />
<text x="1307.5" y="880" text-anchor="middle" class="label">10 · BEGIN</text>
<line class="msg" x1="1065" y1="964" x2="1542" y2="964" />
<text x="1307.5" y="952" text-anchor="middle" class="label">11 · finalizar_questionario()</text>
<path d="M 1550 1028 h 110 v 21 h -110" fill="none" stroke="#42536A" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="1568" y="1018" class="small">Bloquear, validar, inserir e concluir</text>
<path d="M 1550 1104 h 110 v 21 h -110" fill="none" stroke="#42536A" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="1568" y="1094" class="small">Excluir token e desvincular</text>
<line class="msg" x1="1550" y1="1168" x2="1073" y2="1168" stroke-dasharray="8 5"/>
<text x="1307.5" y="1156" text-anchor="middle" class="label">12 · Retorno sem UUID de resposta</text>
<line class="msg" x1="1065" y1="1236" x2="1542" y2="1236" />
<text x="1307.5" y="1224" text-anchor="middle" class="label">13 · COMMIT</text>
<line class="msg" x1="1065" y1="1307" x2="623" y2="1307" stroke-dasharray="8 5"/>
<text x="840.0" y="1295" text-anchor="middle" class="label">14 · Confirmar sucesso</text>
<line class="msg" x1="615" y1="1378" x2="183" y2="1378" stroke-dasharray="8 5"/>
<text x="395.0" y="1366" text-anchor="middle" class="label">15 · Participação concluída</text>
<rect x="75" y="1475" width="1640" height="245" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="103" y="1517" font-weight="bold" font-size="20">Fluxos alternativos e garantias</text>
<text x="106" y="1559" font-size="18">• Token ou participação inválidos → acesso recusado.</text>
<text x="106" y="1597" font-size="18">• Questionário incompleto ou opção incompatível → ROLLBACK e token preservado.</text>
<text x="106" y="1635" font-size="18">• Concorrência pelo mesmo token → apenas uma finalização confirmada.</text>
<text x="106" y="1673" font-size="18">• Sem ligação persistida entre identidade e UUID da resposta; cuidado com logs e categorias pequenas.</text>
</svg>